services:
  app:
    build:
      context: .
      # Pinned explicitly: the Dockerfile carries dev stages after this one,
      # and an untargeted build would pick the last stage in the file.
      target: runtime
    restart: unless-stopped
    # Now that the database is an Atlas host rather than a service on this
    # network, the container has to do real DNS — including the SRV lookup that
    # mongodb+srv:// requires. Docker Desktop's embedded resolver intermittently
    # fails to answer those, so ask public resolvers directly.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Either file works, and a missing one is not an error. `.env.local` is
    # loaded last so it wins where both define the same key — matching the
    # precedence the backend itself uses.
    #
    # MONGODB_URI is deliberately NOT set below: the database lives in Atlas and
    # its connection string comes from these files. Anything in `environment:`
    # would silently outrank them.
    env_file:
      - path: ./server/.env
        required: false
      - path: ./server/.env.local
        required: false
    environment:
      # This stack serves plain HTTP on localhost, so it is not a production
      # deployment and should not claim to be one. "production" turns on HSTS
      # and marks the session cookie Secure — both wrong over http://, and the
      # cookie carries the OAuth state. Set it to production only behind TLS.
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000
      MONGODB_DB_NAME: codechatter
      CODECHATTER_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      # Named volume so workspace snapshots and chat uploads survive rebuilds
      # and stay writable by the non-root runtime user.
      - app-data:/data

volumes:
  app-data:
