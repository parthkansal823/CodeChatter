# Local infrastructure for v2. The apps themselves run on the host with
# `pnpm dev`; Caddy stitches them into one origin at http://localhost:8080 so
# session cookies and every WebSocket are same-origin, exactly as in production.
name: codechatter-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codechatter
      POSTGRES_PASSWORD: codechatter
      POSTGRES_DB: codechatter
    ports: ["15432:5432"]
    volumes: [pg-data:/var/lib/postgresql]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "codechatter"], interval: 2s, retries: 30 }

  valkey:
    image: valkey/valkey:9-alpine
    ports: ["16379:6379"]

  # Catches every email in dev (sign-up verification, resets, invites).
  # UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # S3-compatible object storage for dev (MinIO no longer publishes images).
  # The apps use the AWS S3 SDK, so production can point at any S3 provider.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ["8333:8333"]
    volumes: ["seaweed-data:/data", "./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]

  # Calls in rooms (video, voice, screen share): LiveKit's media server. Signalling goes
  # through Caddy (/livekit); media straight to 7882/udp, or 7881/tcp. See livekit/livekit.dev.yaml.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    volumes: ["./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro"]

  caddy:
    image: caddy:2.11-alpine
    ports: ["8080:8080"]
    volumes: ["./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Optional: the local AI, for people without a key. A profile, so `pnpm infra:up` and CI
  # don't download it: `pnpm ai:up` starts it, `pnpm ai:pull` gets the model. Models live in
  # a volume. The context length is the server's, because the API talks to Ollama's
  # OpenAI-style endpoint, which can't set one per request; AI_CONTEXT_CHARS has to fit it.
  ollama:
    image: ollama/ollama:0.40.14
    profiles: [ai]
    ports: ["11434:11434"]
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_KEEP_ALIVE: 30m
    volumes: [ollama-models:/root/.ollama]
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 3s, retries: 40 }

volumes:
  pg-data:
  seaweed-data:
  ollama-models:
