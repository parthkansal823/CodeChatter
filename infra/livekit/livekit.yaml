# Production calls on one Docker host. Caddy handles HTTPS signalling; media and
# TURN/UDP reach these ports directly. Credentials come from LIVEKIT_KEYS, never this file.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  node_ip: ""
turn:
  enabled: true
  udp_port: 3478
  # Caddy owns TCP 443 and its certificates. TURN/TLS needs a separate public endpoint.
  tls_port: 0
logging:
  level: info
