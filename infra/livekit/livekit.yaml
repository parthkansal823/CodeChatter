# Production calls on one Docker host. Caddy handles HTTPS signalling; media and
# TURN/UDP reach these ports directly. Caddy terminates TURN/TLS on public 443.
# Credentials come from LIVEKIT_KEYS, never this file.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  node_ip: ""
turn:
  enabled: true
  udp_port: 3478
  # Compose sets LIVEKIT_TURN_DOMAIN using the pinned server's generated env flag.
  # YAML itself does not expand environment variables.
  domain: ""
  tls_port: 5349
  external_tls: true
  # Only the Caddy address on the dedicated TURN proxy network may supply headers.
  proxy_protocol: true
  proxy_protocol_trusted_cidrs: [172.30.250.2/32]
logging:
  level: info
