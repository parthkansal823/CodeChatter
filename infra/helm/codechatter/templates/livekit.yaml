{{- /* One call server: signalling stays private; media and TURN bypass the edge. */ -}}
{{- define "cc.livekitTurnDomain" -}}
{{- $siteHost := regexFind "^https?://[^/:?#]+" .Values.url | trimPrefix "https://" | trimPrefix "http://" -}}
{{- $domain := .Values.livekit.turn.tls.domain | default (printf "turn.%s" $siteHost) | lower -}}
{{- if or (gt (len $domain) 253) (not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" $domain)) (regexMatch "^[0-9]+(\\.[0-9]+){3}$" $domain) -}}
{{- fail "livekit.turn.tls.domain must be a DNS hostname without a scheme, path, port or wildcard (or set url to a valid origin for its turn.<host> default)" -}}
{{- end -}}
{{- $domain -}}
{{- end -}}
{{- define "cc.livekitConfig" -}}
port: 7880
rtc:
  tcp_port: {{ .Values.livekit.rtc.tcpPort }}
  udp_port: {{ .Values.livekit.rtc.udpPort }}
  use_external_ip: {{ .Values.livekit.rtc.useExternalIp }}
  node_ip: {{ .Values.livekit.rtc.nodeIp | quote }}
  enable_loopback_candidate: {{ .Values.livekit.rtc.enableLoopbackCandidate }}
turn:
  enabled: {{ .Values.livekit.turn.enabled }}
  udp_port: {{ .Values.livekit.turn.udpPort }}
  {{- if .Values.livekit.turn.tls.enabled }}
  domain: {{ include "cc.livekitTurnDomain" . | quote }}
  tls_port: {{ .Values.livekit.turn.tls.port }}
  external_tls: {{ .Values.livekit.turn.tls.externalTls }}
  proxy_protocol: {{ .Values.livekit.turn.tls.proxyProtocol }}
  {{- if .Values.livekit.turn.tls.proxyProtocol }}
  proxy_protocol_trusted_cidrs: {{- toYaml .Values.livekit.turn.tls.trustedProxyCidrs | nindent 4 }}
  {{- end }}
  {{- if not .Values.livekit.turn.tls.externalTls }}
  cert_file: /etc/livekit-turn-tls/tls.crt
  key_file: /etc/livekit-turn-tls/tls.key
  {{- end }}
  {{- else }}
  tls_port: 0
  {{- end }}
  {{- with .Values.livekit.turn.allowRestrictedPeerCidrs }}
  allow_restricted_peer_cidrs: {{- toYaml . | nindent 4 }}
  {{- end }}
logging:
  level: info
{{- end -}}
{{- if .Values.livekit.enabled }}
{{- $component := dict "root" . "component" "livekit" }}
{{- $service := .Values.livekit.media.service }}
{{- $turnTLS := .Values.livekit.turn.tls }}
{{- if $turnTLS.enabled }}
{{- if not .Values.livekit.turn.enabled }}
{{- fail "livekit.turn.tls.enabled requires livekit.turn.enabled" }}
{{- end }}
{{- if or (not (regexMatch "^[0-9]+$" (toString $turnTLS.port))) (lt (int $turnTLS.port) 1024) (gt (int $turnTLS.port) 65535) (eq (int $turnTLS.port) 7880) (eq (int $turnTLS.port) (int .Values.livekit.rtc.tcpPort)) }}
{{- fail "livekit.turn.tls.port must be an unused TCP port from 1024 to 65535, distinct from signalling and rtc.tcpPort" }}
{{- end }}
{{- if ne $turnTLS.service.type "LoadBalancer" }}
{{- fail "livekit.turn.tls.service.type must be LoadBalancer with public TCP 443; a NodePort alone cannot match LiveKit's advertised turns:443 endpoint" }}
{{- end }}
{{- if or (not (regexMatch "^[0-9]+$" (toString $turnTLS.service.port))) (ne (int $turnTLS.service.port) 443) }}
{{- fail "livekit.turn.tls.service.port must be 443 because LiveKit 1.13.11 advertises turns:<domain>:443" }}
{{- end }}
{{- if not (has $turnTLS.service.externalTrafficPolicy (list "Local" "Cluster")) }}
{{- fail "livekit.turn.tls.service.externalTrafficPolicy must be Local or Cluster" }}
{{- end }}
{{- if and (eq $turnTLS.service.externalTrafficPolicy "Cluster") (not $turnTLS.proxyProtocol) }}
{{- fail "TURN TLS externalTrafficPolicy Cluster requires proxyProtocol and trustedProxyCidrs to preserve the original client address" }}
{{- end }}
{{- if $turnTLS.externalTls }}
{{- if $turnTLS.secretName }}
{{- fail "livekit.turn.tls.secretName must be empty with externalTls; the TLS load balancer owns the certificate" }}
{{- end }}
{{- if not $turnTLS.proxyProtocol }}
{{- fail "externalTls requires a TLS load balancer sending PROXY protocol v2; enable livekit.turn.tls.proxyProtocol and set trustedProxyCidrs" }}
{{- end }}
{{- else if not $turnTLS.secretName }}
{{- fail "livekit.turn.tls.secretName is required when LiveKit terminates TURN TLS" }}
{{- end }}
{{- if and $turnTLS.proxyProtocol (not $turnTLS.trustedProxyCidrs) }}
{{- fail "livekit.turn.tls.proxyProtocol requires trustedProxyCidrs for the actual load balancer/proxy source addresses" }}
{{- end }}
{{- end }}
{{- if not (has $service.type (list "LoadBalancer" "NodePort")) }}
{{- fail "livekit.media.service.type must be LoadBalancer or NodePort so browsers can reach media" }}
{{- end }}
{{- if eq $service.type "NodePort" }}
{{- if or (ne (int $service.nodePorts.tcp) (int .Values.livekit.rtc.tcpPort)) (ne (int $service.nodePorts.udp) (int .Values.livekit.rtc.udpPort)) }}
{{- fail "NodePort calls require livekit.media.service.nodePorts.tcp/udp to equal livekit.rtc.tcpPort/udpPort; choose ports in your cluster's NodePort range" }}
{{- end }}
{{- if and .Values.livekit.turn.enabled (ne (int $service.nodePorts.turn) (int .Values.livekit.turn.udpPort)) }}
{{- fail "NodePort TURN requires livekit.media.service.nodePorts.turn to equal livekit.turn.udpPort" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-livekit
  labels: {{- include "cc.componentLabels" $component | nindent 4 }}
data:
  livekit.yaml: |
    {{- include "cc.livekitConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-livekit
  labels: {{- include "cc.componentLabels" $component | nindent 4 }}
spec:
  # No Redis cluster: rooms live on this one server. Replacing it interrupts calls.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "cc.selector" $component | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cc.componentLabels" $component | nindent 8 }}
      annotations:
        checksum/livekit: {{ include "cc.livekitConfig" . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {{- include "cc.podSecurity" (dict) | nindent 8 }}
      containers:
        - name: livekit
          image: {{ .Values.livekit.image }}
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/livekit/livekit.yaml]
          ports:
            - { name: http, containerPort: 7880 }
            - { name: rtc-tcp, containerPort: {{ .Values.livekit.rtc.tcpPort }} }
            - { name: rtc-udp, containerPort: {{ .Values.livekit.rtc.udpPort }}, protocol: UDP }
            {{- if .Values.livekit.turn.enabled }}
            - { name: turn-udp, containerPort: {{ .Values.livekit.turn.udpPort }}, protocol: UDP }
            {{- end }}
            {{- if $turnTLS.enabled }}
            - { name: turn-tls, containerPort: {{ $turnTLS.port }}, protocol: TCP }
            {{- end }}
          env:
            - name: LIVEKIT_KEYS
              valueFrom: { secretKeyRef: { name: {{ include "cc.secretName" . }}, key: LIVEKIT_KEYS } }
          securityContext: {{- include "cc.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.livekit.resources | nindent 12 }}
          {{- include "cc.probes" (dict "path" "/" "port" "http") | nindent 10 }}
          volumeMounts:
            - { name: config, mountPath: /etc/livekit, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if and $turnTLS.enabled (not $turnTLS.externalTls) }}
            - { name: turn-tls, mountPath: /etc/livekit-turn-tls, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-livekit }
        - name: tmp
          emptyDir: {}
        {{- if and $turnTLS.enabled (not $turnTLS.externalTls) }}
        - name: turn-tls
          secret: { secretName: {{ $turnTLS.secretName | quote }}, defaultMode: 0440 }
        {{- end }}
---
# Signalling is reachable only through Caddy's /livekit route.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-livekit
  labels: {{- include "cc.componentLabels" $component | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cc.selector" $component | nindent 4 }}
  ports:
    - { name: http, port: 7880, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-livekit-media
  labels: {{- include "cc.componentLabels" $component | nindent 4 }}
  {{- with $service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  externalTrafficPolicy: {{ $service.externalTrafficPolicy }}
  {{- if and (eq $service.type "LoadBalancer") $service.loadBalancerIP }}
  loadBalancerIP: {{ $service.loadBalancerIP | quote }}
  {{- end }}
  selector: {{- include "cc.selector" $component | nindent 4 }}
  ports:
    - name: rtc-tcp
      port: {{ .Values.livekit.rtc.tcpPort }}
      targetPort: rtc-tcp
      protocol: TCP
      {{- with $service.nodePorts.tcp }}
      nodePort: {{ . }}
      {{- end }}
    - name: rtc-udp
      port: {{ .Values.livekit.rtc.udpPort }}
      targetPort: rtc-udp
      protocol: UDP
      {{- with $service.nodePorts.udp }}
      nodePort: {{ . }}
      {{- end }}
    {{- if .Values.livekit.turn.enabled }}
    - name: turn-udp
      port: {{ .Values.livekit.turn.udpPort }}
      targetPort: turn-udp
      protocol: UDP
      {{- with $service.nodePorts.turn }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
{{- if $turnTLS.enabled }}
---
# TURN has its own public TLS address; the website's HTTPS endpoint is unchanged.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-livekit-turn-tls
  labels: {{- include "cc.componentLabels" $component | nindent 4 }}
  {{- with $turnTLS.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ $turnTLS.service.externalTrafficPolicy }}
  {{- with $turnTLS.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector: {{- include "cc.selector" $component | nindent 4 }}
  ports:
    - { name: turn-tls, port: 443, targetPort: turn-tls, protocol: TCP }
{{- end }}
{{- end }}
