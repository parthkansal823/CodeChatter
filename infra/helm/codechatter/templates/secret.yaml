{{- /*
The app's secrets: given in values, else kept from the Secret an earlier install made, else
made up now. (`helm template` can't look one up, so it makes new ones each time.)
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "cc.secretName" .)).data | default dict -}}
{{- $kept := dict -}}
{{- range $key := list "BETTER_AUTH_SECRET" "SERVICE_SECRET" "POSTGRES_PASSWORD" "LIVEKIT_API_KEY" "LIVEKIT_API_SECRET" -}}
{{- $_ := set $kept $key (get $existing $key | b64dec) -}}
{{- end -}}
{{- $auth := .Values.secrets.betterAuth | default (get $kept "BETTER_AUTH_SECRET") | default (randAlphaNum 48) -}}
{{- $service := .Values.secrets.service | default (get $kept "SERVICE_SECRET") | default (randAlphaNum 48) -}}
{{- $postgres := .Values.secrets.postgresPassword | default (get $kept "POSTGRES_PASSWORD") | default (randAlphaNum 32) -}}
{{- $livekitKey := .Values.secrets.livekitApiKey | default (get $kept "LIVEKIT_API_KEY") | default (randAlphaNum 24) -}}
{{- $livekitSecret := .Values.secrets.livekitApiSecret | default (get $kept "LIVEKIT_API_SECRET") | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cc.secretName" . }}
  labels: {{- include "cc.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ $auth | quote }}
  SERVICE_SECRET: {{ $service | quote }}
  POSTGRES_PASSWORD: {{ $postgres | quote }}
  LIVEKIT_API_KEY: {{ $livekitKey | quote }}
  LIVEKIT_API_SECRET: {{ $livekitSecret | quote }}
  LIVEKIT_KEYS: {{ printf "%s: %s" $livekitKey $livekitSecret | quote }}
  DATABASE_URL: {{ .Values.postgres.externalUrl | default (printf "postgres://codechatter:%s@%s-postgres:5432/codechatter" $postgres .Release.Name) | quote }}
  SMTP_PASS: {{ .Values.mail.smtp.password | quote }}
  {{- if .Values.objectStore.endpoint }}
  S3_ACCESS_KEY: {{ required "objectStore.accessKey is needed with objectStore.endpoint" .Values.objectStore.accessKey | quote }}
  S3_SECRET_KEY: {{ required "objectStore.secretKey is needed with objectStore.endpoint" .Values.objectStore.secretKey | quote }}
  {{- end }}
  {{- range $name, $value := .Values.ai.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
