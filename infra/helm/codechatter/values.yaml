# CodeChatter on Kubernetes. These defaults run the whole app as a demo on Docker
# Desktop's built-in Kubernetes (or kind): build the images, install, and open
# http://localhost:8090 (README.md). Notes marked "Production" say what to change
# for a real deployment.

# Where people open it: the browser's origin. Sign-in checks it.
# Production: your https:// address, with TLS in front of the edge.
url: http://localhost:8090
# Each dev server's preview gets its own origin under this one (p3000-<room>.preview...).
# Empty: "preview." in front of the host above.
# Production: a separate domain, so a preview can't share cookies with the app.
previewOrigin: ""

images:
  # The app images (infra/docker/app.Dockerfile): codechatter-web, -api, -collab, -runner, -migrate.
  # Empty registry: images built on this machine (README.md). Production: your registry, a pinned
  # tag, and pullPolicy IfNotPresent.
  registry: ""
  tag: latest
  # Always, as Kubernetes does for "latest": a rebuilt image reaches the next pod that starts.
  pullPolicy: Always

# The one way in: Caddy with the same routes as infra/caddy (app, API, collab, previews, mail).
edge:
  image: caddy:2.11-alpine
  service:
    # Docker Desktop serves a LoadBalancer on localhost. Production: ClusterIP behind your Ingress.
    type: LoadBalancer
    port: 8090

web:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }

api:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 768Mi } }

collab:
  replicas: 1
  resources: { requests: { cpu: 25m, memory: 128Mi }, limits: { memory: 512Mi } }

# Calls: signalling goes through the edge; media and TURN go directly to this service.
livekit:
  enabled: true
  image: livekit/livekit-server:v1.13.11
  # Empty: url above, with ws:// or wss:// and /livekit appended.
  url: ""
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
  rtc:
    tcpPort: 7881
    udpPort: 7882
    # Production: discover this node's public address. Behind a LoadBalancer, set false
    # and nodeIp to its reachable IP; the advertised IP must deliver the ports below.
    useExternalIp: true
    nodeIp: ""
    # Localhost-only demo: true, with nodeIp 127.0.0.1 and useExternalIp false.
    enableLoopbackCandidate: false
  turn:
    enabled: true
    udpPort: 3478
    # TURN normally denies private/loopback peers. Permit only the call server's
    # exact IP/32 if it uses one of these addresses, never whole private networks.
    allowRestrictedPeerCidrs: []
    # Opt in for production: a dedicated TCP 443 LoadBalancer, separate from the website.
    tls:
      enabled: false
      # Empty: turn.<host from url>. Must match the public certificate and DNS record.
      domain: ""
      # The non-root pod listens here; LiveKit advertises public TCP 443 regardless.
      port: 5349
      # Existing kubernetes.io/tls Secret with tls.crt and tls.key for domain.
      secretName: ""
      # True only when a real TCP/TLS load balancer terminates TLS before the pod.
      # Requires PROXY protocol v2 and explicit trusted proxy CIDRs; no Secret is mounted.
      externalTls: false
      proxyProtocol: false
      trustedProxyCidrs: []
      service:
        type: LoadBalancer
        port: 443
        annotations: {}
        externalTrafficPolicy: Local
        loadBalancerIP: ""
  media:
    service:
      # Must support TCP and UDP. NodePort is an alternative; match its nodePorts
      # to rtc.tcpPort, rtc.udpPort and turn.udpPort (README.md).
      type: LoadBalancer
      annotations: {}
      externalTrafficPolicy: Local
      loadBalancerIP: ""
      nodePorts: { tcp: null, udp: null, turn: null }

# Rooms' sandboxes, databases and package proxies, in namespaces cc-<namespace>-<room>.
runner:
  namespace: demo
  resources: { requests: { cpu: 25m, memory: 128Mi }, limits: { memory: 512Mi } }
  sandbox:
    # pnpm sandbox:build (codechatter-sandbox:dev), or :full with every language.
    image: codechatter-sandbox:dev
    # Always: a rebuilt image reaches the next room that starts. Production: a pinned tag and IfNotPresent.
    pull: Always
    memoryMb: 768
    cpus: 1
    pids: 256
    idleMinutes: 15
    storageGb: 5
    databaseStorageGb: 2
    # Empty: the cluster's default storage class.
    storageClass: ""

postgres:
  # Production: a managed database or CloudNativePG, given as externalUrl (postgres://…).
  enabled: true
  externalUrl: ""
  image: postgres:18-alpine
  storage: 5Gi
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }

# Nightly logical dumps of bundled Postgres. Managed external databases use their
# own backup policy; externalUrl disables this job even when enabled is true.
backup:
  enabled: true
  # Build infra/backup/Dockerfile, then publish this image for a remote cluster.
  image: codechatter-backup:pg18-rclone1.70.3
  pullPolicy: IfNotPresent
  schedule: "0 3 * * *"
  # Kubernetes 1.27+ interprets schedule in this zone, independently of node TZ.
  timeZone: UTC
  retention: { daily: 7, weekly: 4, monthly: 6 }
  storage: 10Gi
  # Empty: inherit storageClass below, then the cluster's default.
  storageClass: ""
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 21600
  s3:
    # Empty: local PVC only. Prefer an existing dedicated Secret in production.
    url: ""
    endpoint: ""
    region: us-east-1
    accessKey: ""
    secretKey: ""
    forcePathStyle: true
    # Keys: BACKUP_S3_URL, BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY;
    # optional BACKUP_S3_ENDPOINT, BACKUP_S3_REGION, BACKUP_S3_FORCE_PATH_STYLE.
    existingSecret: ""

valkey:
  enabled: true
  externalUrl: ""
  image: valkey/valkey:9-alpine
  storage: 1Gi
  resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 256Mi } }

mail:
  from: "CodeChatter <noreply@codechatter.local>"
  # Demo: Mailpit catches every email (sign-up, password resets); read them at <url>/mail/.
  # Production: false, and your SMTP server below.
  mailpit: true
  mailpitImage: axllent/mailpit:latest
  smtp: { host: "", port: 465, user: "", password: "" }

# Demo only: the test accounts and rooms of `pnpm seed`, so you can sign in at once as
# test1@codechatter.local or test2@codechatter.local (password codechatter123).
# Production: false.
seed: true

# Rooms' binary files (images, PDFs, fonts) go to an S3-compatible bucket, which the API and the
# runner both reach (docs/deploy.md "Binary files"). Empty endpoint: binary files are off.
objectStore:
  endpoint: ""
  region: us-east-1
  bucket: ""
  # Kept in the app's Secret.
  accessKey: ""
  secretKey: ""

ai:
  # none, ollama, anthropic, gemini or openai: apps/api/src/ai (and .env.example).
  provider: none
  # More of its settings for the API, e.g. { AI_MODEL: hermes3, OLLAMA_URL: "http://…:11434" }.
  env: {}
  # Its secrets (API keys), kept in the app's Secret, e.g. { ANTHROPIC_API_KEY: "…" }.
  secretEnv: {}

# Generated on install and kept on upgrades when empty.
secrets:
  betterAuth: ""
  service: ""
  postgresPassword: ""
  livekitApiKey: ""
  livekitApiSecret: ""

# For the Postgres and Valkey claims. Empty: the cluster's default.
storageClass: ""
