# Load the reviewed dashboard from disk so development needs no manual imports.
apiVersion: 1
providers:
  - name: CodeChatter
    orgId: 1
    folder: CodeChatter
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
