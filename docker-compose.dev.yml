# CodeChatter — development stack with live reload.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Frontend: http://localhost:5173  (Vite dev server, hot module replacement)
# Backend:  http://localhost:8000  (uvicorn --reload)
#
# Both source trees are bind-mounted, so editing a file on the host reloads the
# matching service — the frontend patches the running page without losing state,
# the backend restarts the process.
#
# The database is MongoDB Atlas, shared with the production stack, so both see
# the same data. Only one stack can hold port 8000 at a time — run
# `docker compose down` before starting this one.
name: codechatternk-dev

services:
  api:
    build:
      context: .
      target: server-dev
    restart: unless-stopped
    # Now that the database is an Atlas host rather than a service on this
    # network, the container has to do real DNS — including the SRV lookup that
    # mongodb+srv:// requires. Docker Desktop's embedded resolver intermittently
    # fails to answer those, so ask public resolvers directly.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # MONGODB_URI is deliberately NOT in `environment:` below — it comes from
    # these files, and an `environment:` entry would silently outrank them.
    env_file:
      - path: ./server/.env
        required: false
      - path: ./server/.env.local
        required: false
    environment:
      ENVIRONMENT: development
      # The browser now talks to Vite, not to FastAPI, so the frontend origin
      # is 5173. Both values matter: FRONTEND_URL is where OAuth hands the user
      # back, ALLOWED_ORIGINS is what CORS and the redirect allow-list accept.
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MONGODB_DB_NAME: codechatter
      CODECHATTER_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - api-data:/data
    # The image still carries the production `client/dist` from its build stage,
    # and FastAPI would happily serve that stale bundle on :8000 — which looks
    # like the app but is frozen at build time and has no HMR. Blanking the
    # directory makes :8000 answer with the API status JSON instead, so there is
    # exactly one place to open the UI in dev: the Vite server on :5173.
    tmpfs:
      - /app/client/dist

  web:
    build:
      context: .
      target: client-dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Without this the client would default to 127.0.0.1:8000. Same host, but
      # spelling it "localhost" keeps the origin identical to FRONTEND_URL, so
      # the OAuth round trip and CORS agree on one name.
      VITE_API_URL: http://localhost:8000
      # Switches Vite's watcher to polling — see client/vite.config.js.
      VITE_DOCKER: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      # Anonymous volume: keeps the image's node_modules from being shadowed by
      # the bind mount above.
      - /app/client/node_modules

volumes:
  api-data:
