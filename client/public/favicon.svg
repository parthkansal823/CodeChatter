<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Flat, single-colour app mark.

    A favicon is rendered at 16px. The previous version used three gradients,
    a Gaussian glow and a drop-shadow filter, all of which collapse into a
    smudge at that size. Solid fill + thick strokes stay legible instead.
  -->
  <rect width="512" height="512" rx="112" fill="#0078D4"/>
  <g stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 186 L126 256 L196 326"/>
    <path d="M316 186 L386 256 L316 326"/>
  </g>
</svg>
