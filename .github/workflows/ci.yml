name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:8080
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4
      - name: Set up Node.js 24 and the pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check lint rules
        run: pnpm lint
      - name: Check TypeScript types
        run: pnpm typecheck
      - name: Run workspace unit tests
        run: pnpm test
      - name: Run web unit tests with the runner's tsx
        run: |
          mapfile -d '' tests < <(git ls-files -z 'apps/web/**/*.test.ts')
          if (( ${#tests[@]} == 0 )); then
            echo "No tracked web unit tests found."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/apps/runner"
          pnpm exec tsx --test "${tests[@]/#/$GITHUB_WORKSPACE/}"
      - name: Run collaboration unit tests
        run: |
          mapfile -d '' tests < <(git ls-files -z 'apps/collab/src/**/*.test.ts')
          if (( ${#tests[@]} == 0 )); then
            echo "No tracked collaboration unit tests found."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/apps/collab"
          pnpm exec tsx --test "${tests[@]/#/$GITHUB_WORKSPACE/}"

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codechatter
          POSTGRES_PASSWORD: codechatter
          POSTGRES_DB: codechatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codechatter -d codechatter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://codechatter:codechatter@localhost:5432/codechatter
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4
      - name: Set up Node.js 24 and the pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Verify migrations succeed again without changes
        run: pnpm db:migrate

  images:
    name: images (${{ matrix.name }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: migrate
            target: migrate
            context: .
            dockerfile: infra/docker/app.Dockerfile
            timeout: 30
          - name: api
            target: api
            context: .
            dockerfile: infra/docker/app.Dockerfile
            timeout: 30
          - name: collab
            target: collab
            context: .
            dockerfile: infra/docker/app.Dockerfile
            timeout: 30
          - name: runner
            target: runner
            context: .
            dockerfile: infra/docker/app.Dockerfile
            timeout: 30
          - name: web
            target: web
            context: .
            dockerfile: infra/docker/app.Dockerfile
            timeout: 30
          - name: sandbox-base
            target: base
            context: ./sandbox
            dockerfile: sandbox/image/Dockerfile
            timeout: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image without publishing it
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # SARIF uploads in private repositories also read workflow metadata.
      actions: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4
      - name: Set up Node.js 24 and the pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for high and critical vulnerabilities
        run: pnpm audit --prod --audit-level=high
      - name: Scan repository dependencies and secrets with Trivy
        if: ${{ !cancelled() }}
        # Trivy publishes release tags, but no major-only v0 tag.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          limit-severities-for-sarif: 'true'
          skip-dirs: .git,**/node_modules,**/.next,**/dist,client,server
          cache-dir: ${{ runner.temp }}/trivy-cache
          timeout: 10m
      - name: Upload Trivy findings to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
