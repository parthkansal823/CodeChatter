name: Sandbox full image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the full sandbox image without publishing it
        uses: docker/build-push-action@v7
        with:
          context: ./sandbox
          file: sandbox/image/Dockerfile
          target: full
          push: false
          cache-from: type=gha,scope=ci-sandbox-full
          cache-to: type=gha,mode=max,scope=ci-sandbox-full
