# v1 (client/, server/) and throwaway spikes stay outside the workspace.
packages:
  - "apps/*"
  - "packages/*"
  - "sandbox/agent"
  - "tools/*"

# pnpm blocks dependency build scripts by default; allow only known native
# binaries (reviewed individually).
allowBuilds:
  esbuild: true
  "@swc/core": true
  unrs-resolver: true
  # dockerode (apps/runner) pulls these in; their scripts only build optional
  # native speed-ups for SSH Docker hosts and a version check. Not needed.
  ssh2: false
  cpu-features: false
  protobufjs: false

# pnpm holds back packages published too recently (supply-chain policy).
# These exact versions were reviewed and pinned: @nestjs/cli 12.0.6 and the
# Angular devkit it depends on for schematics; lucide-react icons.
minimumReleaseAgeExclude:
  - "@angular-devkit/core@22.2.0"
  - "@angular-devkit/schematics-cli@22.2.0"
  - "@angular-devkit/schematics@22.2.0"
  - "@nestjs/cli@12.0.6"
  - "lucide-react@1.48.0"
  - monaco-languageclient@11.0.2
  - vscode-ws-jsonrpc@4.0.2
  - socket.io-client@4.8.4
  # Security updates (2026-11-04, pnpm audit in CI): better-auth 1.7.16 and Next 16.4.5
  # with their own packages, newer than the release-age policy allows.
  - '@better-auth/core@1.7.16'
  - '@better-auth/drizzle-adapter@1.7.16'
  - '@better-auth/kysely-adapter@1.7.16'
  - '@better-auth/memory-adapter@1.7.16'
  - '@better-auth/mongo-adapter@1.7.16'
  - '@better-auth/prisma-adapter@1.7.16'
  - '@better-auth/telemetry@1.7.16'
  - better-auth@1.7.16
  - better-call@1.4.5
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - eslint-config-next@16.4.5
  - next@16.4.5

# Monaco runs on the VS Code API build (monaco-languageclient 11; ADR 0001).
overrides:
  monaco-editor: "npm:@codingame/monaco-vscode-editor-api@37.1.0"
  # Security fixes for packages that come in through others (pnpm audit, docs/ci.md),
  # kept to the major version those others ask for.
  body-parser: "^2.4.0"
  multer: "^2.5.0"
  dompurify: "^3.4.17"
  undici: "^8.12.3"
  sharp: "^0.35.5"
  source-map-js: "^1.2.2"
  zod: "^4.6.7"
